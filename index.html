<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Misión Ares: Supervivencia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Pantalla de inicio: los botones están alineados sobre el menú dibujado -->
  <section id="menu">
    <div class="menu-marco">
      <div class="menu-placa">SUPERVIVENCIA</div>
      <nav class="menu-botones">
        <button id="m-jugar" class="menu-btn">JUGAR</button>
        <button id="m-sonido" class="menu-btn">SONIDO: SÍ</button>
        <button id="m-datos" class="menu-btn">DATOS NASA</button>
        <button id="m-creditos" class="menu-btn">CRÉDITOS</button>
      </nav>
    </div>
  </section>

  <section id="juego" hidden>
    <header>
      <h1>MISIÓN ARES<span>: SUPERVIVENCIA</span></h1>
      <div class="info"><span id="sitio"></span><strong id="dia"></strong></div>
      <button id="btn-sonido" class="chico" title="Sonido">🔊</button>
      <button id="btn-datos" class="chico">DATOS NASA</button>
    </header>
    <main>
      <div class="zona-mapa">
        <canvas id="mapa"></canvas>
        <div id="toast" class="toast" hidden><b id="toast-titulo"></b><span id="toast-texto"></span></div>
        <p id="objetivo" class="objetivo"></p>
      </div>
      <aside>
        <div class="stats">
          <div class="stats-dentro" id="hud"></div>
        </div>
        <div class="bitacora">
          <h2>BITÁCORA</h2>
          <div id="mensajes" class="mensajes"></div>
        </div>
      </aside>
    </main>
  </section>

  <div id="modal" class="modal" hidden>
    <div class="caja" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <h2 id="modal-titulo"></h2>
      <div class="caja-dentro">
        <div id="modal-cuerpo"></div>
        <div id="modal-botones" class="botones"></div>
      </div>
    </div>
  </div>

  <canvas id="transicion" hidden></canvas>
  <script type="module" src="js/main.js"></script>
</body>
</html>
